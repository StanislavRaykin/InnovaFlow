<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InnovaFlow</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- Bootstrap is deliberately NOT loaded: its utilities (.text-primary,
         .bg-primary, .border, .shadow-sm, .px-4 ...) share names with Tailwind's
         and are emitted with !important, so they silently win over the design
         tokens in js/tailwind.config.js. The files remain under lib/ but are
         unreferenced. -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Client.styles.css" rel="stylesheet" />

    <!-- Fonts used on every page. They live here rather than in a layout's
         <HeadContent>: only the last-rendered HeadContent reaches <head>, so any
         page with its own HeadContent used to drop the layout's font links and
         the icons fell back to their ligature text. -->
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />

    <!-- Tailwind must be loaded here rather than from a component: <script> tags
         inside .razor files are injected through the DOM and are not guaranteed
         to execute. The config assignment has to come after the CDN script. -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="js/tailwind.config.js"></script>

    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
